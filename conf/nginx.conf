#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {

    alias __INSTALL_DIR__/;

    # Common parameter to increase upload size limit in conjunction with dedicated php-fpm file
    client_max_body_size 50M;

    # Add headers to serve security related headers
    more_set_headers "Strict-Transport-Security: max-age=15768000";
    more_set_headers "X-Content-Type-Options: nosniff";
    more_set_headers "X-Frame-Options: SAMEORIGIN";
    more_set_headers "X-XSS-Protection: 1; mode=block";
    more_set_headers "X-Download-Options: noopen";
    more_set_headers "X-Permitted-Cross-Domain-Policies: none";

    index index.php;
    # Bug in Nginx with locations and aliases (see http://stackoverflow.com/a/35102259 )
    try_files $uri $uri/ __PATH__/__PATH__/index.php?$query_string;

    ## PACKAGING NOTE: contrary to Grav's configuration example, we are here nested in a location{} block,
    ## so we need to add the path before the leading / of the regexes to make them match correctly

    ## Begin - Security
    # deny hidden files and directories at any depth, except ACME challenges
    location ~ (^|/)\.(?!well-known(?:/|$)) { return 403; }
    # deny all direct access for these folders
    location ~* ^__PATH__/(\.git|cache|bin|logs|backup|tmp|webserver-configs|tests)/.*$ { return 403; }
    # deny all direct access to these sensitive user folders, whatever the file type
    location ~* ^__PATH__/user/(env/[^/]+/)?config/.*$ { return 403; }
    # allow avatar images under user/accounts to be served directly, whether stored
    # at user/accounts/avatars/<file> (flatfile accounts) or user/accounts/<username>/
    # <file> (Flex folder storage); this must come before the user/accounts deny so it
    # wins the first-match. SVG is intentionally excluded as a stored-XSS vector.
    location ~* ^__PATH__/user/(env/[^/]+/)?accounts/[^/]+/[^/]+\.(jpe?g|png|gif|webp|avif|bmp|ico)$ { try_files $uri =404; }
    # deny everything else under user/accounts, whatever the file type
    location ~* ^__PATH__/user/(env/[^/]+/)?accounts/.*$ { return 403; }
    # allow public media uploads under user/data (e.g. Flex Object images) to be
    # served directly; this must come before the user/data deny so it wins the
    # first-match. SVG is intentionally excluded as a stored-XSS vector.
    location ~* ^__PATH__/user/(env/[^/]+/)?data/.*\.(jpe?g|png|gif|webp|avif|bmp|ico|mp4|webm|ogg|ogv|mov|mp3|wav|m4a|flac|pdf)$ { try_files $uri =404; }
    # deny everything else under user/data, whatever the file type
    location ~* ^__PATH__/user/(env/[^/]+/)?data/.*$ { return 403; }
    # Serve page media only through the page route, so plugins can apply the
    # page's `access` rules to it. DO NOT uncomment without first setting
    # `pages.media_route_urls: true` in user/config/system.yaml, or every media
    # URL on the site becomes a 403.
    # location ~* ^/user/pages/.*$ { return 403; }
    # deny running scripts in the public cache folders (image derivatives and combined assets)
    location ~* ^__PATH__/(images|assets)/.*\.(php|php2|php3|php4|php5|php7|php8|phar|phtml|pht|phtm|phps|pl|py|cgi|sh|bat)$ { return 403; }
    # deny running scripts inside core system folders
    location ~* ^__PATH__/(system|vendor)/.*\.(txt|xml|md|html|htm|shtml|shtm|json|yaml|yml|php|php2|php3|php4|php5|phar|phtml|pl|py|cgi|twig|sh|bat)$ { return 403; }
    # deny running scripts inside user folder
    location ~* ^__PATH__/user/.*\.(txt|md|json|yaml|yml|php|php2|php3|php4|php5|phar|phtml|pl|py|cgi|twig|sh|bat)$ { return 403; }
    # deny access to specific files in the root folder
    location ~* ^__PATH__/(LICENSE\.txt|composer\.lock|composer\.json|nginx\.conf|web\.config|htaccess\.txt|\.htaccess) { return 403; }
    # deny access to .env environment files (expression purposefully not anchored)
    location ~ /\.env(\.|$) { return 403; }
    # deny Markdown source files such as README.md and CHANGELOG.md; a page route
    # ending in .md is not a file, so it still reaches Grav's Markdown output
    location ~* \.md$ {
        if (-f $request_filename) { return 403; }
        try_files $uri __PATH__/__PATH__/index.php?$query_string;
    }
    ## End - Security

    ## Begin - Static asset caching
    # MUST stay below the security block. nginx picks the FIRST matching regex
    # location, so a caching rule placed above would answer for paths the denies
    # above are meant to refuse. For the same reason these use regex (`~*`) and
    # never `^~`: a `^~` prefix match wins over every regex location regardless
    # of order, which would bypass the user/accounts and user/data rules.

    # Content-hashed bundles shipped by SvelteKit-based plugins and themes (the
    # Admin panel among them). The filename changes whenever the contents do, so
    # these can be cached permanently. `=404` keeps a missing chunk from booting
    # PHP just to render a 404 — and, on any host that serves an SPA from a
    # static index.html fallback, stops a deleted chunk being answered with the
    # HTML shell at 200, which a browser cannot parse as a module.
    location ~* ^__PATH__/_app/immutable/.*\.(js|css|woff2?)$ {
        try_files $uri =404;
        access_log off;
        more_set_header "Cache-Control: public, max-age=31536000, immutable";
    }

    # Everything else static gets a moderate TTL and still revalidates via the
    # ETag/Last-Modified nginx already sends. Deliberately NOT `immutable`:
    # these filenames are stable across edits, so a long hard cache would pin
    # stale media until the name changed.
    # The try_files fallback is load-bearing, not boilerplate: Grav serves some
    # media through index.php (cached image derivatives, plugin media proxies),
    # so a bare static handler would hard-404 assets that PHP would have
    # produced on demand. Adding caching must not change WHAT is served.
    location ~* \.(jpe?g|png|gif|webp|avif|bmp|ico|svg|mp4|webm|ogg|ogv|mov|mp3|wav|m4a|flac|css|js|woff2?|ttf|otf|eot)$ {
        try_files $uri $uri/ __PATH__/__PATH__/index.php?$query_string;
        expires 30d;
        access_log off;
    }
    ## End - Static asset caching

    ## voir https://learn.getgrav.org/17/webservers-hosting/servers/nginx#nginx-cache-headers-for-assets
    # https://github.com/getgrav/grav-plugin-form/issues/577
    location ~* ^__PATH__/forms-basic-captcha-image.jpg$ {
        try_files $uri $uri/ __PATH__/__PATH__/index.php?$query_string;
    }

    location ~ \.php$ {
    fastcgi_pass unix:/var/run/php/php__PHP_VERSION__-fpm-__APP__.sock;
    include fastcgi_params_no_auth;
    # https://learn.getgrav.org/webservers-hosting/servers/nginx#fix-against-httpoxy-vulnerability
    fastcgi_param HTTP_PROXY "";
    }

}
